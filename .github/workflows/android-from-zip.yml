name: Android CI (build from zip)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and flatten project
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          ZIPFILE="$(ls -1 *.zip 2>/dev/null | head -n1 || true)"
          if [ -n "$ZIPFILE" ]; then
            echo "Found zip: $ZIPFILE"
            unzip -o "$ZIPFILE" -d .
            # Find the first directory with gradle files inside and move it to root
            INNER_DIR=$(find . -type f -name "build.gradle.kts" -exec dirname {} \; | head -n1)
            if [ -n "$INNER_DIR" ] && [ "$INNER_DIR" != "." ]; then
              echo "Moving contents of $INNER_DIR to root..."
              shopt -s dotglob
              mv "$INNER_DIR"/* .
            fi
          else
            echo "No zip file found."
          fi
          echo "Final structure:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing, using system gradle"
            gradle assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
