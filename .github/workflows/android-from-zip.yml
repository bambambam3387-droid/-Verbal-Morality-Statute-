name: Android CI (build from zip)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project (handle nested folder)
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          # Find any .zip file in repo and extract
          ZIPFILE="$(ls -1 *.zip 2>/dev/null | head -n1 || true)"
          if [ -n "$ZIPFILE" ]; then
            echo "Found zip: $ZIPFILE"
            unzip -o "$ZIPFILE" -d .
            TOPDIR="$(zipinfo -1 "$ZIPFILE" | head -n1 | cut -d/ -f1)"
            if [ -d "$TOPDIR" ]; then
              echo "Moving $TOPDIR contents to root"
              shopt -s dotglob
              mv "$TOPDIR"/* .
            fi
          else
            echo "No zip file found, continuing..."
          fi
          echo "Final folder structure:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing, using system gradle"
            gradle assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
